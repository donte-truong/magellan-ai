name: Backend

on:
  push:
    paths: ["backend/**", "docs/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magellan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d magellan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/magellan_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements*.lock"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: pytest -q
      - name: Verify migrations
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://postgres:postgres@localhost:5432/magellan_test' || 'sqlite:///./migration-check.db' }}
        run: |
          alembic upgrade head
          alembic check
