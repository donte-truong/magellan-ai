      <stop offset=".5" stop-color="#a9cfff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a9cfff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
