<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Magellan</title>
  <desc id="description">Explore the supply chain behind every product. A compass and a luminous network of connected nodes on a midnight blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1930"/>
      <stop offset=".55" stop-color="#081121"/>
      <stop offset="1" stop-color="#101b35"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="0" cy="0" r="1" gradientTransform="translate(1080 210) rotate(90) scale(330 450)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#497dbb" stop-opacity=".2"/>
      <stop offset="1" stop-color="#497dbb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="760" y1="40" x2="1260" y2="390" gradientUnits="userSpaceOnUse">
